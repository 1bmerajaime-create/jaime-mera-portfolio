name = "jaime-portfolio-chat"
main = "src/index.ts"
compatibility_date = "2025-04-01"

# Public vars (no secrets). Set your real site origins after deploy.
[vars]
ALLOWED_ORIGINS = "http://127.0.0.1:5500,http://127.0.0.1:8080,http://localhost:5500,http://localhost:8080"
# Override in dashboard if needed: claude-sonnet-4-20250514, claude-3-5-sonnet-20241022, etc.
ANTHROPIC_MODEL = "claude-3-5-sonnet-20241022"

# wrangler secret put ANTHROPIC_API_KEY
